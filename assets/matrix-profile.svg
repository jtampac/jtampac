<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="330"
  viewBox="0 0 1200 330"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Matrix Footer</title>
  <desc id="desc">Matrix-inspired closing terminal message.</desc>

  <rect width="1200" height="330" fill="#000000"/>

  <rect
    x="2"
    y="2"
    width="1196"
    height="326"
    rx="12"
    fill="none"
    stroke="#00ff41"
    stroke-width="2"
  />

  <g font-family="Consolas, Monaco, 'Courier New', monospace">

    <text
      x="600"
      y="70"
      text-anchor="middle"
      font-size="18"
      fill="#ffffff"
    >
      The Matrix is everywhere.
    </text>

    <text
      x="600"
      y="102"
      text-anchor="middle"
      font-size="18"
      fill="#ffffff"
    >
      It is all around us.
    </text>

    <text
      x="600"
      y="134"
      text-anchor="middle"
      font-size="18"
      fill="#ffffff"
    >
      Even now, in this very room.
    </text>

    <line
      x1="340"
      y1="170"
      x2="860"
      y2="170"
      stroke="#003f16"
      stroke-width="2"
    />

    <text
      x="600"
      y="215"
      text-anchor="middle"
      font-size="17"
      fill="#00ff41"
    >
      &gt; Knock, knock, Neo.
    </text>

    <text
      x="600"
      y="246"
      text-anchor="middle"
      font-size="17"
      fill="#00ff41"
    >
      &gt; Do you want to know what it is?
    </text>

    <text
      x="600"
      y="288"
      text-anchor="middle"
      font-size="16"
      fill="#8affaa"
    >
      Follow the white rabbit... or just ship something that actually works.
    </text>
  </g>

  <rect x="1060" y="278" width="13" height="22" fill="#00ff41"/>
</svg>
