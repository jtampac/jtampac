<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="1080"
  viewBox="0 0 1200 1080"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Junmarvi Matrix GitHub Profile</title>
  <desc id="desc">
    Matrix-inspired profile showing system status, active constructs and core directives.
  </desc>

  <rect width="1200" height="1080" fill="#000000"/>

  <!-- Border -->
<defs>
  <linearGradient id="bgGlow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#031b08"/>
    <stop offset="45%" stop-color="#021406"/>
    <stop offset="100%" stop-color="#000000"/>
  </linearGradient>

  <pattern id="matrixPattern" width="320" height="140" patternUnits="userSpaceOnUse">
    <rect width="320" height="140" fill="transparent"/>

    <g
      font-family="Consolas, Monaco, 'Courier New', monospace"
      font-size="18"
      font-weight="700"
      fill="#00ff41"
      opacity="0.78"
    >
      <text x="0" y="24">01001100 01010011 00110001 00110000 00110000 00110001</text>
      <text x="0" y="48">00110001 00110000 00110001 00110000 00110001 00110000</text>
      <text x="0" y="72">00110000 00110001 00110000 00110000 00110001 00110001</text>
      <text x="0" y="96">00110001 00110001 00110000 00110001 00110000 00110000</text>
      <text x="0" y="120">00110000 00110001 00110001 00110000 00110001 00110000</text>
    </g>

    <g
      font-family="Consolas, Monaco, 'Courier New', monospace"
      font-size="18"
      font-weight="700"
      fill="#6dff8a"
      opacity="0.24"
    >
      <text x="18" y="36">11001001 01001010 00110101 01001010 00110100</text>
      <text x="18" y="84">01010101 00110110 01001001 00110100 01001010</text>
      <text x="18" y="132">00110100 00110101 01001010 00110101 01001001</text>
    </g>
  </pattern>

  <linearGradient id="panelFade" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.38"/>
  </linearGradient>
</defs>

<rect width="1200" height="1080" fill="url(#bgGlow)"/>
<rect width="1200" height="1080" fill="url(#matrixPattern)"/>

<!-- soft dark overlay para readable gihapon ang text -->
<rect width="1200" height="1080" fill="url(#panelFade)"/>

  <!-- Header -->
  <g font-family="Consolas, Monaco, 'Courier New', monospace">
    <text
      x="600"
      y="95"
      text-anchor="middle"
      font-size="52"
      font-weight="700"
      fill="#00ff41"
      letter-spacing="8"
    >
      JUNMARVI
    </text>

    <text
      x="600"
      y="140"
      text-anchor="middle"
      font-size="20"
      font-weight="700"
      fill="#ffffff"
    >
    </text>

    <text
      x="600"
      y="172"
      text-anchor="middle"
      font-size="16"
      fill="#00ff41"
    >
      jtampac
    </text>

    <text
      x="600"
      y="220"
      text-anchor="middle"
      font-size="16"
      fill="#9affb5"
    >
      &gt; Wake up, Neo...
    </text>

    <text
      x="600"
      y="248"
      text-anchor="middle"
      font-size="16"
      fill="#9affb5"
    >
      &gt; The Matrix has you.
    </text>

    <text
      x="600"
      y="276"
      text-anchor="middle"
      font-size="16"
      fill="#9affb5"
    >
      &gt; Follow the white rabbit.
    </text>
  </g>

  <!-- Divider -->
  <line
    x1="55"
    y1="320"
    x2="1145"
    y2="320"
    stroke="#00ff41"
    stroke-width="2"
  />

  <!-- System Status -->
  <g font-family="Consolas, Monaco, 'Courier New', monospace">
    <text
      x="70"
      y="370"
      font-size="23"
      font-weight="700"
      fill="#00ff41"
    >
      [ SYSTEM STATUS ]
    </text>

    <g font-size="18">
      <text x="90" y="415" fill="#00ff41">&gt;</text>
      <text x="120" y="415" fill="#8affaa">IDENTITY</text>
      <text x="320" y="415" fill="#ffffff">Junmarvi Tampac</text>

      <text x="90" y="453" fill="#00ff41">&gt;</text>
      <text x="120" y="453" fill="#8affaa">LOCATION</text>
      <text x="320" y="453" fill="#ffffff">United Arab Emirates</text>

      <text x="90" y="491" fill="#00ff41">&gt;</text>
      <text x="120" y="491" fill="#8affaa">HOST</text>
      <text x="320" y="491" fill="#ffffff">junmarvi.com</text>

      <text x="90" y="529" fill="#00ff41">&gt;</text>
      <text x="120" y="529" fill="#8affaa">KERNEL</text>
      <text x="320" y="529" fill="#ffffff">AI Application Assurance + Vibe Coding</text>

      <text x="90" y="567" fill="#00ff41">&gt;</text>
      <text x="120" y="567" fill="#8affaa">SHELL</text>
      <text x="320" y="567" fill="#ffffff">Terminal + Local LLMs + Multi-agent</text>

      <text x="90" y="605" fill="#00ff41">&gt;</text>
      <text x="120" y="605" fill="#8affaa">RESOLUTION</text>
      <text x="320" y="605" fill="#ffffff">Evidence before claims</text>

      <text x="90" y="643" fill="#00ff41">&gt;</text>
      <text x="120" y="643" fill="#8affaa">UPTIME</text>
      <text x="320" y="643" fill="#ffffff">Building systems that refuse to lie</text>

      <text x="90" y="681" fill="#00ff41">&gt;</text>
      <text x="120" y="681" fill="#8affaa">THREAT LEVEL</text>
      <text x="320" y="681" fill="#00ff41">HIGH — fake dashboards detected</text>
    </g>
  </g>

  <!-- Divider -->
  <line
    x1="55"
    y1="720"
    x2="1145"
    y2="720"
    stroke="#003f16"
    stroke-width="2"
  />

  <!-- Two columns -->
  <g font-family="Consolas, Monaco, 'Courier New', monospace">

    <!-- Active Constructs -->
    <text
      x="70"
      y="770"
      font-size="23"
      font-weight="700"
      fill="#00ff41"
    >
      [ ACTIVE CONSTRUCTS ]
    </text>

    <g font-size="16" fill="#ffffff">
      <text x="90" y="812">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">Junmarvi Application Assurance Platform</tspan>
      </text>

      <text x="90" y="844">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">Sentinel — trust &amp; security layer</tspan>
      </text>

      <text x="90" y="876">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">Family Wallet</tspan>
      </text>

      <text x="90" y="908">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">Learning Hall PH</tspan>
      </text>

      <text x="90" y="940">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">ICM Cloud Multiplayer Workbench</tspan>
      </text>

      <text x="90" y="972">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">junmarvi-workspace-starter</tspan>
      </text>

      <text x="90" y="1004">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">Local AI media archives + Synology</tspan>
      </text>
    </g>

    <!-- Vertical divider -->
    <line
      x1="600"
      y1="755"
      x2="600"
      y2="1025"
      stroke="#003f16"
      stroke-width="2"
    />

    <!-- Core Directives -->
    <text
      x="640"
      y="770"
      font-size="23"
      font-weight="700"
      fill="#00ff41"
    >
      [ CORE DIRECTIVES ]
    </text>

    <g font-size="16" fill="#ffffff">
      <text x="660" y="812">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">Evidence before claims</tspan>
      </text>

      <text x="660" y="844">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">Deterministic checks before AI interpretation</tspan>
      </text>

      <text x="660" y="876">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">AI may assist but cannot certify itself</tspan>
      </text>

      <text x="660" y="908">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">No fake dashboards. No fake confidence.</tspan>
      </text>

      <text x="660" y="940">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">Every decision must have an owner</tspan>
      </text>

      <text x="660" y="972">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">Every fix must be verified</tspan>
      </text>

      <text x="660" y="1004">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">There is no spoon. Only verifiable systems.</tspan>
      </text>
    </g>
  </g>

  <!-- Terminal cursor -->
  <rect x="1110" y="1035" width="14" height="24" fill="#00ff41"/>
</svg>
