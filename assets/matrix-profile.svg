<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="1080"
  viewBox="0 0 1200 1080"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Junmarvi Tech Matrix GitHub Profile</title>
  <desc id="desc">
    Tech-inspired profile showing system status, active constructs and core directives.
  </desc>

  <defs>
    <linearGradient id="bgBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05090c"/>
      <stop offset="50%" stop-color="#020406"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <pattern id="chipPattern" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#05080b"/>
      <rect x="0" y="0" width="24" height="24" fill="#0a0f13"/>
      <rect x="24" y="24" width="24" height="24" fill="#0a0f13"/>
    </pattern>

    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="traceGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#5cf2ff"/>
    </linearGradient>

    <linearGradient id="traceGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5cf2ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1080" fill="url(#bgBase)"/>
  <rect width="1200" height="1080" fill="url(#chipPattern)" opacity="0.55"/>

  <!-- outer border -->
  <rect
    x="2"
    y="2"
    width="1196"
    height="1076"
    rx="12"
    fill="none"
    stroke="#00ff41"
    stroke-width="2"
  />

  <!-- circuit background -->
  <g opacity="0.9" filter="url(#glowCyan)" stroke-linecap="round" stroke-linejoin="round">
    <!-- center spine -->
    <line x1="600" y1="130" x2="600" y2="930" stroke="url(#traceGrad2)" stroke-width="3"/>
    <circle cx="600" cy="230" r="5" fill="#5cf2ff"/>
    <circle cx="600" cy="340" r="5" fill="#00ff88"/>
    <circle cx="600" cy="470" r="5" fill="#5cf2ff"/>
    <circle cx="600" cy="610" r="5" fill="#00ff88"/>
    <circle cx="600" cy="760" r="5" fill="#5cf2ff"/>
    <circle cx="600" cy="880" r="5" fill="#00ff88"/>

    <!-- left traces -->
    <path d="M600 240 H500 V190 H350 V150 H210" fill="none" stroke="url(#traceGrad1)" stroke-width="3"/>
    <path d="M600 290 H520 V260 H390 V230 H250" fill="none" stroke="url(#traceGrad1)" stroke-width="2.5"/>
    <path d="M600 360 H470 V390 H310 V430 H180" fill="none" stroke="url(#traceGrad1)" stroke-width="3"/>
    <path d="M600 430 H530 V470 H430 V520 H280 V565 H180" fill="none" stroke="url(#traceGrad1)" stroke-width="2.5"/>
    <path d="M600 540 H500 V580 H380 V640 H230" fill="none" stroke="url(#traceGrad1)" stroke-width="3"/>
    <path d="M600 690 H450 V730 H300 V790 H170" fill="none" stroke="url(#traceGrad1)" stroke-width="2.5"/>

    <!-- right traces -->
    <path d="M600 240 H700 V190 H850 V150 H990" fill="none" stroke="url(#traceGrad1)" stroke-width="3"/>
    <path d="M600 290 H680 V260 H810 V230 H950" fill="none" stroke="url(#traceGrad1)" stroke-width="2.5"/>
    <path d="M600 360 H730 V390 H890 V430 H1020" fill="none" stroke="url(#traceGrad1)" stroke-width="3"/>
    <path d="M600 430 H670 V470 H770 V520 H920 V565 H1020" fill="none" stroke="url(#traceGrad1)" stroke-width="2.5"/>
    <path d="M600 540 H700 V580 H820 V640 H970" fill="none" stroke="url(#traceGrad1)" stroke-width="3"/>
    <path d="M600 690 H750 V730 H900 V790 H1030" fill="none" stroke="url(#traceGrad1)" stroke-width="2.5"/>

    <!-- vertical accents -->
    <line x1="260" y1="150" x2="260" y2="330" stroke="url(#traceGrad2)" stroke-width="2"/>
    <line x1="340" y1="260" x2="340" y2="470" stroke="url(#traceGrad2)" stroke-width="2"/>
    <line x1="920" y1="150" x2="920" y2="330" stroke="url(#traceGrad2)" stroke-width="2"/>
    <line x1="840" y1="260" x2="840" y2="470" stroke="url(#traceGrad2)" stroke-width="2"/>

    <!-- nodes cyan -->
    <g fill="#5cf2ff">
      <circle cx="500" cy="240" r="4"/>
      <circle cx="350" cy="190" r="4"/>
      <circle cx="520" cy="290" r="4"/>
      <circle cx="470" cy="360" r="4"/>
      <circle cx="430" cy="470" r="4"/>
      <circle cx="380" cy="640" r="4"/>
      <circle cx="700" cy="240" r="4"/>
      <circle cx="850" cy="190" r="4"/>
      <circle cx="680" cy="290" r="4"/>
      <circle cx="730" cy="360" r="4"/>
      <circle cx="770" cy="520" r="4"/>
      <circle cx="820" cy="640" r="4"/>
    </g>

    <!-- nodes green -->
    <g fill="#00ff88">
      <circle cx="210" cy="150" r="4"/>
      <circle cx="250" cy="230" r="4"/>
      <circle cx="180" cy="430" r="4"/>
      <circle cx="180" cy="565" r="4"/>
      <circle cx="170" cy="790" r="4"/>
      <circle cx="990" cy="150" r="4"/>
      <circle cx="950" cy="230" r="4"/>
      <circle cx="1020" cy="430" r="4"/>
      <circle cx="1020" cy="565" r="4"/>
      <circle cx="1030" cy="790" r="4"/>
    </g>
  </g>

  <!-- readable panels -->
  <rect x="55" y="120" width="1090" height="190" rx="12" fill="#000000" fill-opacity="0.46"/>
  <rect x="55" y="338" width="1090" height="360" rx="12" fill="#000000" fill-opacity="0.50"/>
  <rect x="55" y="740" width="1090" height="290" rx="12" fill="#000000" fill-opacity="0.50"/>

  <!-- subtle code marks -->
  <g
    font-family="Consolas, Monaco, 'Courier New', monospace"
    font-size="11"
    fill="#0c6d34"
    opacity="0.55"
  >
    <text x="72" y="150">01010100 01000101 01000011 01001000 00101110 01010011 01010100 01000001 01000011 01001011</text>
    <text x="855" y="172">01101010 01110100 01100001 01101101 01110000 01100001 01100011</text>
    <text x="78" y="1010">00110010 00110000 00110010 00110110 00101110 01010011 01011001 01010011</text>
    <text x="915" y="1010">01010110 01000101 01010010 01001001 01000110 01011001</text>
  </g>

  <!-- header -->
  <g font-family="Consolas, Monaco, 'Courier New', monospace">
    <text
      x="600"
      y="95"
      text-anchor="middle"
      font-size="42"
      font-weight="700"
      fill="#00ff88"
      letter-spacing="5"
    >
      JUNMARVI
    </text>

    <text
      x="600"
      y="140"
      text-anchor="middle"
      font-size="20"
      font-weight="700"
      fill="#ffffff"
    >
    </text>

    <text
      x="600"
      y="172"
      text-anchor="middle"
      font-size="16"
      fill="#5cf2ff"
    >
      jtampac
    </text>

    <text
      x="600"
      y="220"
      text-anchor="middle"
      font-size="16"
      fill="#9affb5"
    >
      &gt; Wake up, Neo...
    </text>

    <text
      x="600"
      y="248"
      text-anchor="middle"
      font-size="16"
      fill="#9affb5"
    >
      &gt; The Matrix has you.
    </text>

    <text
      x="600"
      y="276"
      text-anchor="middle"
      font-size="16"
      fill="#9affb5"
    >
      &gt; Follow the white rabbit.
    </text>
  </g>

  <!-- divider -->
  <line
    x1="55"
    y1="320"
    x2="1145"
    y2="320"
    stroke="#00ff41"
    stroke-width="2"
  />

  <!-- system status -->
  <g font-family="Consolas, Monaco, 'Courier New', monospace">
    <text
      x="70"
      y="370"
      font-size="23"
      font-weight="700"
      fill="#00ff41"
    >
      [ SYSTEM STATUS ]
    </text>

    <g font-size="18">
      <text x="90" y="415" fill="#00ff41">&gt;</text>
      <text x="120" y="415" fill="#8affaa">IDENTITY</text>
      <text x="320" y="415" fill="#ffffff">Junmarvi Tampac</text>

      <text x="90" y="453" fill="#00ff41">&gt;</text>
      <text x="120" y="453" fill="#8affaa">LOCATION</text>
      <text x="320" y="453" fill="#ffffff">United Arab Emirates</text>

      <text x="90" y="491" fill="#00ff41">&gt;</text>
      <text x="120" y="491" fill="#8affaa">HOST</text>
      <text x="320" y="491" fill="#ffffff">junmarvi.com</text>

      <text x="90" y="529" fill="#00ff41">&gt;</text>
      <text x="120" y="529" fill="#8affaa">KERNEL</text>
      <text x="320" y="529" fill="#ffffff">AI Application Assurance + Vibe Coding</text>

      <text x="90" y="567" fill="#00ff41">&gt;</text>
      <text x="120" y="567" fill="#8affaa">SHELL</text>
      <text x="320" y="567" fill="#ffffff">Terminal + Local LLMs + Multi-agent</text>

      <text x="90" y="605" fill="#00ff41">&gt;</text>
      <text x="120" y="605" fill="#8affaa">RESOLUTION</text>
      <text x="320" y="605" fill="#ffffff">Evidence before claims</text>

      <text x="90" y="643" fill="#00ff41">&gt;</text>
      <text x="120" y="643" fill="#8affaa">UPTIME</text>
      <text x="320" y="643" fill="#ffffff">Building systems that refuse to lie</text>

      <text x="90" y="681" fill="#00ff41">&gt;</text>
      <text x="120" y="681" fill="#8affaa">THREAT LEVEL</text>
      <text x="320" y="681" fill="#00ff41">HIGH — fake dashboards detected</text>
    </g>
  </g>

  <!-- divider -->
  <line
    x1="55"
    y1="720"
    x2="1145"
    y2="720"
    stroke="#003f16"
    stroke-width="2"
  />

  <!-- lower section -->
  <g font-family="Consolas, Monaco, 'Courier New', monospace">
    <!-- active constructs -->
    <text
      x="70"
      y="770"
      font-size="23"
      font-weight="700"
      fill="#00ff41"
    >
      [ ACTIVE CONSTRUCTS ]
    </text>

    <g font-size="16" fill="#ffffff">
      <text x="90" y="812">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">Junmarvi Application Assurance Platform</tspan>
      </text>

      <text x="90" y="844">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">Sentinel — trust &amp; security layer</tspan>
      </text>

      <text x="90" y="876">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">Family Wallet</tspan>
      </text>

      <text x="90" y="908">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">Learning Hall PH</tspan>
      </text>

      <text x="90" y="940">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">ICM Cloud Multiplayer Workbench</tspan>
      </text>

      <text x="90" y="972">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">junmarvi-workspace-starter</tspan>
      </text>

      <text x="90" y="1004">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">Local AI media archives + Synology</tspan>
      </text>
    </g>

    <!-- vertical divider -->
    <line
      x1="600"
      y1="755"
      x2="600"
      y2="1025"
      stroke="#003f16"
      stroke-width="2"
    />

    <!-- core directives -->
    <text
      x="640"
      y="770"
      font-size="23"
      font-weight="700"
      fill="#00ff41"
    >
      [ CORE DIRECTIVES ]
    </text>

    <g font-size="16" fill="#ffffff">
      <text x="660" y="812">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">Evidence before claims</tspan>
      </text>

      <text x="660" y="844">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">Deterministic checks before AI interpretation</tspan>
      </text>

      <text x="660" y="876">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">AI may assist but cannot certify itself</tspan>
      </text>

      <text x="660" y="908">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">No fake dashboards. No fake confidence.</tspan>
      </text>

      <text x="660" y="940">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">Every decision must have an owner</tspan>
      </text>

      <text x="660" y="972">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">Every fix must be verified</tspan>
      </text>

      <text x="660" y="1004">
        <tspan fill="#00ff41">&gt;</tspan>
        <tspan dx="12">There is no spoon. Only verifiable systems.</tspan>
      </text>
    </g>
  </g>

  <!-- terminal cursor -->
  <rect x="1110" y="1035" width="14" height="24" fill="#00ff41"/>
</svg>
